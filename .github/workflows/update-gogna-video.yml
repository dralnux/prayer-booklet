name: Update Arun Gogna Latest Video

on:
  schedule:
    # Run daily at 6:00 AM UTC (adjust timezone as needed)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest video from YouTube RSS
        run: |
          # Fetch YouTube RSS feed for the channel
          CHANNEL_ID="UCxNjPypE3dqZpJYKFnDDCJA"
          RSS_URL="https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}"

          # Download RSS feed
          curl -fsS "$RSS_URL" -o feed.xml

          # Parse using the JavaScript file
          node scripts/parse-gogna-video.js

      - name: Check for changes
        id: check_changes
        run: |
          git diff --exit-code data/arun-gogna-video.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/arun-gogna-video.json
          git commit -m "Update Arun Gogna latest video

          Automated daily update of the latest video from @gognaarun

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push
