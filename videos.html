<html lang="en">
<head>

<title>Full Tank Video | Catholic Prayers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
<a class="brand" href="index.html">✝ Catholic Prayers</a>
<nav><a href="index.html">Home</a><a href="prayers.html">Daily Prayers</a><a href="novena/index.html">Novenas</a><a href="rosary.html">Rosary</a><a href="videos.html">Videos</a></nav>
</header>

<main class="section video-page">
<div class="section-heading">
<p class="eyebrow">Full Tank</p>
<h1>Daily Video</h1>
</div>
<div class="video-frame">
<div id="videoMessage">Loading...</div><iframe id="videoPlayer" title="Full Tank video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen hidden></iframe>
</div>
<p class="video-link"><a id="videoLink" href="https://www.youtube.com/playlist?list=PLA_KgzimUIuXyOcP5WtOYLwdCogSXYdgz" target="_blank" rel="noopener noreferrer">Open the Full Tank playlist on YouTube →</a></p>

<section class="video-feature" aria-labelledby="gognaVideoHeading">
<div class="section-heading">
<p class="eyebrow">Arun Gogna</p>
<h2 id="gognaVideoHeading">Latest Video</h2>
</div>
<div class="video-frame">
<div id="gognaVideoMessage">Loading latest video...</div>
<iframe id="gognaVideoPlayer" title="Latest video from Arun Gogna" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" hidden></iframe>
</div>
<p class="video-link"><a href="https://www.youtube.com/@gognaarun/videos" target="_blank" rel="noopener noreferrer">View all videos from Arun Gogna →</a></p>
</section>
</main>

<footer><a href="index.html">← Home</a></footer>
<script src="location-content.js"></script>
<script src="daily-content.js"></script>
<script>
const pageNow=new Date();
DailyContent.getVideo(pageNow).then(video => {
 if(!video || !video.id) throw new Error("No video is scheduled for this date");
 const today=DailyContent.todayISO(pageNow);
 if(video.date!==today) throw new Error("Today's video is not available yet");
 document.title=video.title+" | Catholic Prayers";
 const player=document.getElementById("videoPlayer"); player.src="https://www.youtube.com/embed/"+encodeURIComponent(video.id); player.hidden=false; document.getElementById("videoMessage").hidden=true;
 document.getElementById("videoLink").href=video.source;
}).catch(error => { document.getElementById("videoMessage").textContent=error.message; });

fetch("data/arun-gogna-video.json", {cache: "no-store"}).then(response => {
 if(!response.ok) throw new Error("Latest video data is unavailable");
 return response.json();
}).then(video => {
 if(!video || !video.id) throw new Error("No latest video is available");
 const player=document.getElementById("gognaVideoPlayer");
 player.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(video.id);
 player.title=(video.title || "Latest video")+" by Arun Gogna";
 player.hidden=false;
 document.getElementById("gognaVideoMessage").hidden=true;
}).catch(error => { document.getElementById("gognaVideoMessage").textContent=error.message; });
</script>
</body><script src="theme.js"></script>
</html>
